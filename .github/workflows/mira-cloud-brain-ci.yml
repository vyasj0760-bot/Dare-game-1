name: Mira Cloud Brain CI

on:
  push:
    paths:
      - "mira-cloud-brain/**"
      - ".github/workflows/mira-cloud-brain-ci.yml"
  pull_request:
    paths:
      - "mira-cloud-brain/**"
      - ".github/workflows/mira-cloud-brain-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mira-cloud-brain
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          MIRA_API_TOKEN: ci-test-token
        run: pytest -q
