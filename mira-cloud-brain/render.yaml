services:
  - type: web
    name: mira-cloud-brain
    runtime: python
    rootDir: mira-cloud-brain
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 100 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: MIRA_API_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DATABASE_URL
        sync: false
